<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - SmartCart</title>
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card" style="text-align: center;">
        <div class="auth-header" style="margin-bottom: 1.5rem;">
            <div class="success-badge-icon" style="margin-bottom: 1rem; width: 70px; height: 70px; font-size: 2rem;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </div>
            <h2 class="auth-title">Logged Out</h2>
            <p class="auth-subtitle">You have successfully logged out from SmartCart.</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem;">
            <a href="/user-login" class="btn btn-primary btn-block btn-lg">
                <i class="fa-solid fa-right-to-bracket"></i> Login Again
            </a>
            <a href="/user-signup" class="btn btn-secondary btn-block">
                <i class="fa-solid fa-user-plus"></i> Create New Account
            </a>
        </div>
    </div>

</body>
</html>
