
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - SmartCart</title>
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card" style="text-align: center; max-width: 500px;">
        <div class="success-badge-icon">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem;">
            Payment Successful!
        </h2>
        <p style="color: var(--text-muted); font-size: 0.95rem;">
            Your transaction was completed successfully.
        </p>

        <div style="background: var(--bg-surface-subtle); border-radius: var(--radius-md); padding: 1.25rem; margin: 1.75rem 0; border: 1px solid var(--border-subtle); text-align: left;">
            <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 0.25rem;">
                Payment ID
            </div>
            <div style="font-family: monospace; font-size: 1.05rem; font-weight: 700; color: var(--primary); word-break: break-all;">
                {{ payment_id }}
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
            <a href="/user/my-orders" class="btn btn-primary btn-lg btn-block">
                <i class="fa-solid fa-box-open"></i> View My Orders
            </a>
            <a href="/user-dashboard" class="btn btn-secondary btn-block">
                <i class="fa-solid fa-house"></i> Back to Dashboard
            </a>
        </div>
    </div>

</body>
</html>
